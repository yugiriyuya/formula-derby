<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formula Derby</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div class="title"><strong>Formula Derby</strong> — <span id="course-name"></span></div>
      <div class="info" id="course-info"></div>
      <div class="buttons">
        <button data-view="overview">1 全景</button>
        <button data-view="hill">2 淀の坂</button>
        <button data-view="pit">3 ピット</button>
        <button data-view="finish">4 ゴール前</button>
      </div>
      <div class="buttons">
        <button data-preview="normal">5 周回プレビュー</button>
        <button data-preview="pit">6 ピット経由プレビュー</button>
        <button id="toggle-labels">L ラベル</button>
      </div>
      <ul class="legend">
        <li><i style="background: #64b440"></i>芝コース</li>
        <li><i style="background: #c8a470"></i>ダート</li>
        <li><i style="background: #969696"></i>ピットレーン / エプロン</li>
      </ul>
      <div class="help">ドラッグ: 回転 / 右ドラッグ: 移動 / ホイール: ズーム / Esc: プレビュー終了</div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
